name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
        env:
          BASE_URL: /stillmind
          EXPO_NO_TELEMETRY: 1
      - name: SPA fallback, readable overview, skip Jekyll
        run: |
          cp dist/index.html dist/404.html
          cp public/overview.html dist/overview.html
          cp public/overview.md dist/overview.md
          mkdir -p dist/screenshots
          cp public/screenshots/* dist/screenshots/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
